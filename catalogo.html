<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo de produtos ByPulse">
  <title>Catálogo ByPulse</title>
  <style>
    :root {
      --brand: #0ccfd0;
      --brand-dark: #008f94;
      --ink: #1e292d;
      --muted: #667277;
      --paper: #ffffff;
      --canvas: #ffffff;
      --line: #e4e9e8;
      --shadow: 0 6px 20px rgba(22, 55, 56, .06);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Roboto, "Noto Sans", "Segoe UI", Arial, sans-serif;
      line-height: 1.55;
    }

    button, select { font: inherit; }

    .catalog-shell {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 64px;
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      align-items: end;
      gap: 28px;
      padding: 22px 26px 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(12, 207, 208, .32);
      border-radius: 6px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .brand-block { min-width: 0; }

    .brand-logo {
      display: block;
      width: min(270px, 68vw);
      height: 64px;
      object-fit: contain;
      object-position: left center;
      mix-blend-mode: multiply;
    }

    .eyebrow {
      margin: 10px 0 0;
      color: var(--brand-dark);
      font-size: .73rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .catalog-title {
      margin: 4px 0 0;
      font-size: clamp(1.65rem, 4vw, 2.35rem);
      font-weight: 400;
      letter-spacing: -.025em;
      line-height: 1.08;
    }

    .filter-control {
      display: grid;
      gap: 7px;
      min-width: 220px;
    }

    .filter-control label {
      color: var(--muted);
      font-size: .74rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .select-wrap { position: relative; }

    .select-wrap::after {
      content: "⌄";
      position: absolute;
      right: 16px;
      top: 50%;
      color: var(--brand-dark);
      pointer-events: none;
      transform: translateY(-56%);
    }

    select {
      width: 100%;
      min-height: 48px;
      padding: 0 44px 0 15px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
      background: var(--paper);
      appearance: none;
      cursor: pointer;
    }

    select:focus-visible { box-shadow: 0 0 0 4px rgba(12, 207, 208, .18); }

    .catalog-summary {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 0 4px 14px;
      color: var(--muted);
      font-size: .9rem;
    }

    .catalog-summary strong { color: var(--ink); }

    .product-list { display: grid; gap: 18px; }

    .product-card {
      position: relative;
      display: grid;
      grid-template-columns: minmax(250px, 38%) 1fr;
      min-height: 330px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      box-shadow: 0 3px 12px rgba(28, 60, 61, .045);
      transition: transform .22s ease, box-shadow .22s ease;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .product-media {
      position: relative;
      min-height: 330px;
      overflow: hidden;
      background: #ffffff;
      isolation: isolate;
    }

    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform .38s cubic-bezier(.22, .7, .25, 1);
      touch-action: pan-y;
    }

    .carousel-slide {
      flex: 0 0 100%;
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 20px 24px;
    }

    .carousel-slide img {
      display: block;
      width: min(100%, 286px);
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #fff;
      box-shadow: 0 8px 22px rgba(20, 45, 43, .08);
    }

    .image-placeholder {
      display: grid;
      place-items: center;
      width: min(100%, 286px);
      aspect-ratio: 1 / 1;
      color: #7c888b;
      border: 1px solid var(--line);
      background: #fafafa;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
    }

    .variant-label {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 3;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 999px;
      background: rgba(255, 255, 255, .83);
      box-shadow: 0 4px 16px rgba(20, 40, 40, .08);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .carousel-button {
      position: absolute;
      top: 50%;
      z-index: 4;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      color: var(--ink);
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 50%;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 5px 16px rgba(30, 55, 55, .13);
      cursor: pointer;
      transform: translateY(-50%);
    }

    .carousel-button:hover { color: var(--brand-dark); }
    .carousel-button:focus-visible { outline: 3px solid rgba(12, 207, 208, .45); }
    .carousel-button.prev { left: 12px; }
    .carousel-button.next { right: 12px; }

    .carousel-dots {
      position: absolute;
      left: 50%;
      bottom: 14px;
      z-index: 4;
      display: flex;
      gap: 6px;
      transform: translateX(-50%);
    }

    .carousel-dot {
      width: 7px;
      height: 7px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(31, 52, 52, .28);
      cursor: pointer;
      transition: width .2s ease, background .2s ease;
    }

    .carousel-dot.active { width: 22px; border-radius: 9px; background: var(--brand-dark); }

    .product-content {
      display: flex;
      flex-direction: column;
      padding: 25px 26px 23px;
    }

    .product-topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .category-tag {
      display: inline-flex;
      width: fit-content;
      margin-bottom: 9px;
      color: var(--brand-dark);
      font-size: .68rem;
      font-weight: 850;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .product-name {
      max-width: 420px;
      margin: 0;
      font-size: clamp(1.45rem, 3.5vw, 2rem);
      font-weight: 400;
      letter-spacing: -.025em;
      line-height: 1.08;
    }

    .price {
      flex: 0 0 auto;
      padding: 9px 12px;
      color: #063f41;
      border: 1px solid rgba(12, 207, 208, .34);
      border-radius: 6px;
      background: rgba(12, 207, 208, .13);
      font-size: 1.05rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .description {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: .88rem;
    }

    .specs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 18px;
      padding-top: 18px;
      margin: 24px 0 0;
      border-top: 1px solid var(--line);
    }

    .spec { min-width: 0; }
    .spec dt { color: var(--muted); font-size: .66rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .spec dd { margin: 2px 0 0; font-size: .78rem; font-weight: 700; }

    .minimum-order {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 14px;
      margin-top: 14px;
      color: #435155;
      border-left: 3px solid var(--brand);
      background: #f7fafa;
      font-size: .78rem;
    }

    .minimum-order strong { color: var(--ink); font-size: .86rem; }

    .empty-state {
      padding: 54px 20px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 6px;
      text-align: center;
      background: var(--paper);
    }

    .footer-note {
      padding-top: 26px;
      color: var(--muted);
      font-size: .74rem;
      text-align: center;
    }

    [hidden] { display: none !important; }

    @media (max-width: 720px) {
      .catalog-shell { width: min(100% - 20px, 900px); padding-top: 10px; }
      .masthead { grid-template-columns: 1fr; gap: 20px; padding: 21px 19px; border-radius: 6px; }
      .brand-logo { height: 54px; }
      .filter-control { min-width: 0; }
      .product-card { grid-template-columns: 1fr; }
      .product-media { min-height: 285px; }
      .carousel-slide { padding: 14px 16px; }
      .carousel-slide img { width: min(100%, 258px); }
      .product-content { min-height: 310px; padding: 21px 19px; }
      .product-topline { align-items: flex-start; }
      .specs { margin-top: 20px; }
    }

    @media (max-width: 440px) {
      .catalog-summary { display: block; }
      .product-topline { display: grid; }
      .price { width: fit-content; }
      .specs { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="catalog-shell">
    <header class="masthead">
      <div class="brand-block">
        <img class="brand-logo" src="assets/bypulse-logo.png" alt="ByPulse">
        <p class="eyebrow">Seleção corporativa</p>
      </div>
      <div class="filter-control">
        <label for="category-filter">Filtrar por categoria</label>
        <div class="select-wrap">
          <select id="category-filter" aria-label="Filtrar produtos por categoria">
            <option value="all">Todas as categorias</option>
          </select>
        </div>
      </div>
    </header>

    <div class="catalog-summary" aria-live="polite">
      <span><strong id="visible-count">0</strong> produtos selecionados</span>
      <span>Valores unitários</span>
    </div>

    <section id="product-list" class="product-list" aria-label="Produtos"></section>
    <div id="empty-state" class="empty-state" hidden>Nenhum produto encontrado nesta categoria.</div>
    <footer class="footer-note">ByPulse · Produtos que conectam marcas e pessoas.</footer>
  </main>

  <script src="catalogo-data.js"></script>
  <script>
    (() => {
      const products = Array.isArray(window.CATALOGO_PRODUTOS) ? window.CATALOGO_PRODUTOS : [];
      const list = document.querySelector('#product-list');
      const filter = document.querySelector('#category-filter');
      const count = document.querySelector('#visible-count');
      const empty = document.querySelector('#empty-state');
      const money = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

      const escapeHtml = (value = '') => String(value)
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

      const categories = [...new Set(products.map(product => product.categoria).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'pt-BR'));
      categories.forEach(category => {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        filter.append(option);
      });

      const createMedia = (product, cardIndex) => {
        const variants = (product.variacoes || []).filter(item => item.imagemArquivo);
        const usable = variants.length ? variants : [{ cor: '', imagemArquivo: '' }];
        const slides = usable.map((variant, index) => `
          <div class="carousel-slide" aria-hidden="${index !== 0}">
            ${variant.imagemArquivo
              ? `<img src="${escapeHtml(variant.imagemArquivo)}" alt="${escapeHtml(product.nome)}${variant.cor ? ` — ${escapeHtml(variant.cor)}` : ''}">`
              : '<div class="image-placeholder" role="img" aria-label="Imagem indisponível">Imagem indisponível</div>'}
          </div>`).join('');
        const controls = usable.length > 1 ? `
          <button class="carousel-button prev" type="button" aria-label="Imagem anterior">‹</button>
          <button class="carousel-button next" type="button" aria-label="Próxima imagem">›</button>
          <div class="carousel-dots" aria-label="Escolher variação">
            ${usable.map((_, index) => `<button class="carousel-dot ${index === 0 ? 'active' : ''}" type="button" data-slide="${index}" aria-label="Mostrar imagem ${index + 1}"></button>`).join('')}
          </div>` : '';
        return `
          <div class="product-media carousel" data-carousel="${cardIndex}" tabindex="0" aria-label="Fotos de ${escapeHtml(product.nome)}">
            <span class="variant-label">${escapeHtml(usable[0].cor || product.produtoCodigoBase)}</span>
            <div class="carousel-track">${slides}</div>
            ${controls}
          </div>`;
      };

      const createCard = (product, index) => {
        const firstPrice = product.variacoes?.find(item => item.valor_final != null)?.valor_final;
        const specs = Object.entries(product.especificacoesTecnicas || {}).slice(0, 4)
          .map(([label, value]) => `<div class="spec"><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd></div>`).join('');
        return `
          <article class="product-card" data-category="${escapeHtml(product.categoria)}">
            ${createMedia(product, index)}
            <div class="product-content">
              <div class="product-topline">
                <div>
                  <span class="category-tag">${escapeHtml(product.categoria)}</span>
                  <h2 class="product-name">${escapeHtml(product.nome)}</h2>
                </div>
                <div class="price">${firstPrice == null ? 'Sob consulta' : money.format(firstPrice)}</div>
              </div>
              <p class="description">${escapeHtml(product.descricao)}</p>
              <dl class="specs">${specs || '<div class="spec"><dt>Referência</dt><dd>' + escapeHtml(product.produtoCodigoBase) + '</dd></div>'}</dl>
              <div class="minimum-order"><span>Quantidade mínima</span><strong>${Number(product.quantidade_minima || 10)} unidades</strong></div>
            </div>
          </article>`;
      };

      list.innerHTML = products.map(createCard).join('');

      const setupCarousel = carousel => {
        const track = carousel.querySelector('.carousel-track');
        const slides = [...carousel.querySelectorAll('.carousel-slide')];
        const dots = [...carousel.querySelectorAll('.carousel-dot')];
        const label = carousel.querySelector('.variant-label');
        const productIndex = Number(carousel.dataset.carousel);
        const variants = products[productIndex].variacoes || [];
        let current = 0;
        let pointerStart = null;

        const show = next => {
          current = (next + slides.length) % slides.length;
          track.style.transform = `translateX(-${current * 100}%)`;
          slides.forEach((slide, index) => slide.setAttribute('aria-hidden', String(index !== current)));
          dots.forEach((dot, index) => dot.classList.toggle('active', index === current));
          label.textContent = variants[current]?.cor || products[productIndex].produtoCodigoBase;
        };

        carousel.querySelector('.prev')?.addEventListener('click', () => show(current - 1));
        carousel.querySelector('.next')?.addEventListener('click', () => show(current + 1));
        dots.forEach(dot => dot.addEventListener('click', () => show(Number(dot.dataset.slide))));
        carousel.addEventListener('keydown', event => {
          if (event.key === 'ArrowLeft') show(current - 1);
          if (event.key === 'ArrowRight') show(current + 1);
        });
        carousel.addEventListener('pointerdown', event => { pointerStart = event.clientX; });
        carousel.addEventListener('pointerup', event => {
          if (pointerStart == null) return;
          const distance = event.clientX - pointerStart;
          if (Math.abs(distance) > 45) show(current + (distance < 0 ? 1 : -1));
          pointerStart = null;
        });
      };

      document.querySelectorAll('.carousel').forEach(setupCarousel);

      const applyFilter = () => {
        const selected = filter.value;
        let visible = 0;
        document.querySelectorAll('.product-card').forEach(card => {
          const show = selected === 'all' || card.dataset.category === selected;
          card.hidden = !show;
          if (show) visible += 1;
        });
        count.textContent = visible;
        empty.hidden = visible !== 0;
      };

      filter.addEventListener('change', applyFilter);
      applyFilter();
    })();
  </script>
</body>
</html>
